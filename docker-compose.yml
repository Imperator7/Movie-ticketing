# Fixed project name: the same containers and volumes whatever folder the repo is cloned into.
name: movie-ticketing

# Local development stack. Production uses AWS RDS (see plan.md), not this file.
services:
  postgres:
    image: postgres:17.6-alpine
    container_name: movie-ticketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?set MIGRATOR_PASSWORD in .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?set APP_USER_PASSWORD in .env}
      APP_DB: ${APP_DB:-movie_ticketing}
      APP_TEST_DB: ${APP_TEST_DB:-movie_ticketing_test}
      TZ: UTC
    ports:
      # 5433 on the host avoids clashing with a local Postgres on 5432. Loopback only.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---- Full stack (`npm run stack:up`): migrate -> seed -> api -> web on http://localhost:8080 ----------------
  # The services below are in the "stack" profile, so `npm run db:up` still starts only Postgres for development.

  migrate:
    profiles: [stack]
    build: { context: ., dockerfile: apps/api/Dockerfile, target: runtime }
    image: movie-ticketing-api
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://migrator:${MIGRATOR_PASSWORD}@postgres:5432/${APP_DB:-movie_ticketing}?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  seed:
    profiles: [stack]
    build: { context: ., dockerfile: apps/api/Dockerfile, target: build }
    image: movie-ticketing-api-build
    command: ["npm", "run", "seed", "-w", "api"]
    environment:
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/${APP_DB:-movie_ticketing}?schema=public
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo-password-123}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  api:
    profiles: [stack]
    image: movie-ticketing-api
    build: { context: ., dockerfile: apps/api/Dockerfile, target: runtime }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@postgres:5432/${APP_DB:-movie_ticketing}?schema=public
      JWT_SECRET: ${JWT_SECRET:?run npm run stack:secrets}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?run npm run stack:secrets}
      TICKET_QR_SECRET: ${TICKET_QR_SECRET:?run npm run stack:secrets}
      WEB_ORIGINS: http://localhost:${WEB_HOST_PORT:-8080}
      # nginx in the web container is the one proxy in front of the API.
      TRUST_PROXY_HOPS: "1"
      # The e2e suite logs in a lot from one IP: run it with RATE_LIMIT_AUTH_PER_MIN=100 npm run stack:up.
      RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-10}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-fake}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      seed: { condition: service_completed_successfully }

  web:
    profiles: [stack]
    image: movie-ticketing-web
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:4000
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }

  # Forwards Stripe test webhooks to the API: `docker compose --profile stack --profile stripe up`.
  # Put the `whsec_...` it prints (`docker compose logs stripe-cli`) into STRIPE_WEBHOOK_SECRET.
  stripe-cli:
    profiles: [stripe]
    image: stripe/stripe-cli:v1.30.0
    command: ["listen", "--forward-to", "http://api:4000/api/v1/payments/webhook"]
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on: [api]

volumes:
  postgres_data:
