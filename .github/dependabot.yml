# Weekly dependency updates, kept to two pull requests: one for npm, one for GitHub Actions.
# Major npm versions are skipped on purpose: they can break the build (TypeScript 7 did), so they are done by hand.
# Security updates are a separate GitHub setting and still open their own pull requests.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
